### Ezaugarri Nagusiak:

### 🔴 Gertaera Erreala: Evaldas Rimasauskas (2013-2015)

            // Escape key listener for modal

        function renderCards() {
            const container1 = document.getElementById('gaia1Container');
            const container2 = document.getElementById('gaia2Container');
            const section1 = document.getElementById('gaia1Section');
            const section2 = document.getElementById('gaia2Section');
            const emptyState = document.getElementById('emptyState');

            const filtered = GLOSSARY_DATA.filter(item => {
                return item.title.toLowerCase().includes(searchQuery) ||
                       item.summary.toLowerCase().includes(searchQuery) ||
                       item.content.toLowerCase().includes(searchQuery);
            });

            if (filtered.length === 0) {
                container1.innerHTML = '';
                container2.innerHTML = '';
                section1.classList.add('hidden');
                section2.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            const g1Items = filtered.filter(item => item.gaia === 1);
            const g2Items = filtered.filter(item => item.gaia === 2);

            if (g1Items.length > 0) {
                section1.classList.remove('hidden');
                container1.innerHTML = g1Items.map(item => createCardHTML(item)).join('');
            } else {
                section1.classList.add('hidden');
                container1.innerHTML = '';
            }

            if (g2Items.length > 0) {
                section2.classList.remove('hidden');
                container2.innerHTML = g2Items.map(item => createCardHTML(item)).join('');
            } else {
                section2.classList.add('hidden');
                container2.innerHTML = '';

            lucide.createIcons();

        function openReaderModal(id) {
            const entry = GLOSSARY_DATA.find(e => e.id === id);
            if (!entry) return;

            document.getElementById('readerTitle').innerText = entry.title;
            document.getElementById('readerSummary').innerText = entry.summary;

            lucide.createIcons();

            document.getElementById('readerModal').classList.add('hidden');

        /* Formatting Helper for Markdown Content with Line-by-Line Grouping for Lists */
        function formatMarkdown(text) {
            let html = escapeHTML(text);
            
            // Headings (### )
            html = html.replace(/### (.*?)(?:\r?\n|$)/g, '<h3 class="font-serif font-bold text-amber-900 dark:text-champagne-400 text-base mt-5 mb-2 border-b border-amber-200 dark:border-amber-500/20 pb-1">$1</h3>\n');
            
            // Bold (**text**)
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900 dark:text-slate-100">$1</strong>');
            
            let lines = html.split(/\r?\n/);
            let out = [];
            let inOl = false;
            let inUl = false;
            
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];
                let trimmed = line.trim();
                
                let olMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);
                let ulMatch = trimmed.match(/^\*\s+(.*)$/);
                
                if (olMatch) {
                    if (inUl) { out.push('</ul>'); inUl = false; }
                    if (!inOl) {
                        out.push('<ol class="list-decimal pl-6 space-y-1 my-2 text-slate-800 dark:text-slate-300">');
                        inOl = true;
                    }
                    out.push('<li>' + olMatch[2] + '</li>');
                } else if (ulMatch) {
                    if (inOl) { out.push('</ol>'); inOl = false; }
                    if (!inUl) {
                        out.push('<ul class="list-disc pl-6 space-y-1 my-2 text-slate-800 dark:text-slate-300">');
                        inUl = true;
                    }
                    out.push('<li>' + ulMatch[1] + '</li>');
                } else {
                    if (inOl) { out.push('</ol>'); inOl = false; }
                    if (inUl) { out.push('</ul>'); inUl = false; }
                    out.push(line);
                }
            }
            if (inOl) out.push('</ol>');
            if (inUl) out.push('</ul>');
            
            let processed = out.join('\n');
            let blocks = processed.split(/\n\s*\n/);
            let finalBlocks = [];
            
            for (let b of blocks) {
                let bTrim = b.trim();
                if (!bTrim) continue;
                if (bTrim.startsWith('<h3') || bTrim.startsWith('<ol') || bTrim.startsWith('<ul')) {
                    finalBlocks.push(bTrim);
                } else {
                    finalBlocks.push('<p class="my-2 leading-relaxed">' + bTrim + '</p>');
                }
            }
            return finalBlocks.join('\n');
        }

        /* Escape HTML Helper */
        function escapeHTML(str) {
            return str ? str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            ) : '';
        }
    </script>
