* **Mezu Alarma-eragileak:** Urgentzia edo mehatxu sentsazioa sortzen dute (adibidez, "zure kontua blokeatuko da").
* **Esteka Faltsuak:** Benetako webguneen itxura bera duten orri iruzurtsuetara bideratzen dute biktima.

### 🔴 Gertaera Erreala: Evaldas Rimasauskas (2013-2015)

### Eraso Motak:

### Nola Funtzionatzen Du?
Birusak edo harrak ez bezala, troiarrek ez dute beren burua automatikoki erreplikatzen. Erabiltzaileak berak deskargatu eta exekutatu behar du, fitxategi edo programa babesgarria dela pentsatuz.

### Babes Neurriak:
Deskargatu programak soilik iturburu ofizial eta egiaztatuetatik.
Mantendu antibirusa eta sistema eragilea eguneratuta.

### Jatorria eta Motak:
* **Hardware Backdoors:** Fabrikazio prozesuan txip edo gailuetan sartutakoak.
* **Software Backdoors:** Garatzaileek mantentze-lanetarako utzitako zirrikituak edo malware bidez sortutakoak.

### Arriskuak:
Sistemaren jabeak jakin gabe, ziberdelagileek eduki guztietarako sarbide osoa lortu dezakete, kontrola hartuz, datuak erauziz edo sistema bera komando bidez urrunetik kudeatuz.

### Babes Neurriak:
Suhesi (Firewall) sendoak konfiguratu sarrera/irteerako trafikoa ikuskatzeko.
Aldian-aldian segurtasun-auditoriak eta kode berrikuspenak egin.

### Spyware Mota Nagusiak:
* **Keylogger-ak:** Teklatuan idatzitako tekla bakoitza erregistratzen dute (pasahitzak detektatzeko).
* **Adware-a:** Baimenik gabeko publizitatea erakutsi eta nabigatzailearen ohiturak segitzen ditu.
* **Espioitza Mugikorra:** Kamara, mikrofonoa eta GPS kokapena urrunetik aktibatzen dituzten aplikazioak.

### Zer Lapurtzen Dute?
* Nabigatzaileetan gordetako erabiltzaile-izenak eta pasahitzak.

### 🔴 Gertaera Erreala: Mirai Botnet-aren Eraso Masiboa (2016)
2016ko urrian, Mirai izeneko botnet-ak Internet osoaren zati handi bat paralizatu zuen. Mirai-k segurtasun-kamera eta router babesgabeak kutsatu zituen (fabrikako pasahitz lehenetsiak erabiliz) **600.000 gailu baino gehiagoko sarea** osatuz. Mirai-k Dyn DNS zerbitzuaren aurkako DDoS eraso erraldoia (1.2 Tbps) abiatu zuen. Ondorioz, ordu batzuetan zehar Interneteko zerbitzu nagusiak erori ziren mundu osoan, besteak beste, **Twitter, Netflix, Spotify, Reddit eta PlayStation Network** lineatik kanpo utziz.`

### Indar Gordin Mota Nagusiak:
* **Hiztegi Erasoa (Dictionary Attack):** Hiztegi batean agertzen diren hitzak edo pasahitz erabilienak soilik probatzea.
* **Credential Stuffing:** Beste webgune batzuetan filtratutako erabiltzaile/pasahitz bikoteak milaka plataformetan automatikoki saiatzea.

        /* Current State */
        let searchQuery = '';

        /* Initialize Lucide Icons & Event Listeners */
        document.addEventListener('DOMContentLoaded', () => {
            renderCards();

            // Search Filter Listener
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                renderCards();
            });

            // Theme Toggle Listener
            document.getElementById('themeToggleBtn').addEventListener('click', () => {
                document.documentElement.classList.toggle('dark');
            });

            // Modal Close Listener
            document.getElementById('closeReaderModalBtn').addEventListener('click', closeReaderModal);
            document.getElementById('readerModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('readerModal')) {
                    closeReaderModal();
                }
            });

            // Escape key listener for modal
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeReaderModal();
            });
        });

        function renderCards() {
            const container = document.getElementById('cardsContainer');
            const emptyState = document.getElementById('emptyState');

            const filtered = GLOSSARY_DATA.filter(item => {
                return item.title.toLowerCase().includes(searchQuery) ||
                       item.summary.toLowerCase().includes(searchQuery) ||
                       item.content.toLowerCase().includes(searchQuery);
            });

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            container.innerHTML = filtered.map(item => `
                <div onclick="openReaderModal('${item.id}')" class="glass-panel gold-card-hover rounded-2xl p-6 flex flex-col justify-between cursor-pointer space-y-4 relative group">
                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-[11px] font-bold text-amber-800 dark:text-champagne-400 uppercase tracking-widest px-2.5 py-1 rounded-full bg-amber-100 dark:bg-amber-500/10 border border-amber-300 dark:border-amber-500/20">
                                Konzeptua
                            </span>
                            <i data-lucide="arrow-up-right" class="w-4 h-4 text-slate-400 group-hover:text-amber-700 dark:group-hover:text-champagne-400 transition-colors"></i>
                        </div>
                        <h2 class="font-serif text-xl font-bold text-slate-900 dark:text-slate-100 group-hover:text-amber-700 dark:group-hover:text-champagne-300 transition-colors">
                            ${escapeHTML(item.title)}
                        </h2>
                        <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed font-normal">
                            ${escapeHTML(item.summary)}
                        </p>
                    </div>

                    <div class="pt-3 border-t border-slate-200 dark:border-slate-800/60 flex items-center justify-between text-xs text-amber-800 dark:text-champagne-400/90 font-semibold">
                        <span>Irakurri xehetasunak eta adibideak</span>
                        <i data-lucide="book-open" class="w-3.5 h-3.5"></i>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
        }

        function openReaderModal(id) {
            const entry = GLOSSARY_DATA.find(e => e.id === id);
            if (!entry) return;

            document.getElementById('readerTitle').innerText = entry.title;
            document.getElementById('readerSummary').innerText = entry.summary;
            document.getElementById('readerContent').innerHTML = formatMarkdown(entry.content);

            document.getElementById('readerModal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeReaderModal() {
            document.getElementById('readerModal').classList.add('hidden');
        }

        /* Formatting Helper for Markdown Content with High Light/Dark Contrast */
        function formatMarkdown(text) {
            let html = escapeHTML(text);
            
            // Headings (### )
            html = html.replace(/### (.*?)\n/g, '<h3 class="font-serif font-bold text-amber-900 dark:text-champagne-400 text-base mt-5 mb-2 border-b border-amber-200 dark:border-amber-500/20 pb-1">$1</h3>');
            
            // Bold (**text**)
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-slate-900 dark:text-slate-100">$1</strong>');
            
            // Bullet points (* )
            html = html.replace(/^\* (.*$)/gim, '<li class="ml-4 list-disc text-slate-800 dark:text-slate-300 my-1">$1</li>');
            
            // Numbered list (1. )
            html = html.replace(/^(\d+)\. (.*$)/gim, '<li class="ml-4 list-decimal text-slate-800 dark:text-slate-300 my-1">$2</li>');

            // Paragraph line breaks
            html = html.replace(/\n\n/g, '</p><p class="my-2 leading-relaxed">');

            return '<p class="my-2 leading-relaxed">' + html + '</p>';
        }

        /* Escape HTML Helper */
        function escapeHTML(str) {
            return str ? str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            ) : '';
        }
    </script>
